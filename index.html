<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydro OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="taskbar">
    <div class="menu">Hydro OS</div>
    <div class="icons">
      <span>🗂️</span>
      <span>🌐</span>
      <span>🎵</span>
      <span>⚙️</span>
      <span>⏻</span>
    </div>
  </div>

  <div class="widgets">
    <div id="clock"></div>
    <div id="calendar"></div>
  </div>

  <div class="terminal">
    <p>hydro@user:~$ <span id="cursor">|</span></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
